    descriptions:
      en: "A concise player's guide to carrom — rules, technique fundamentals, and practical tips."
      da: "En kortfattet spillerguide til carrom — regler, grundlæggende teknik og praktiske tips."
      de: "Ein kompaktes Spielerhandbuch für Carrom — Regeln, Techniken und praktische Tipps."
      mr: "कॅरमसाठी खेळाडूंचे संक्षिप्त मार्गदर्शक — नियम, तंत्राची मूलभूत तत्त्वे आणि व्यावहारिक टिप्स."
