    descriptions:
      en: "Arun Deshpande's complete coaching book — grips, breaks, every major stroke, defence, offence, and advanced board positions."
      da: "Arun Deshpandes komplette træningsbog — greb, åbningsslag, alle hovedslag, forsvar, angreb og avancerede stillinger."
      de: "Arun Deshpandes vollständiges Trainerbuch — Griff, Anstoß, alle Hauptschläge, Verteidigung, Angriff und fortgeschrittene Stellungen."
      mr: "अरुण देशपांडे यांचे संपूर्ण प्रशिक्षण पुस्तक — पकड, ब्रेक, सर्व मुख्य स्ट्रोक, संरक्षण, हल्ला आणि प्रगत बोर्ड स्थिती."
      it: "Il libro completo di coaching di Arun Deshpande — impugnature, break, tutti i colpi principali, difesa, attacco e posizioni avanzate."
      fr: "Le livre d'entraînement complet d'Arun Deshpande — prises, breaks, tous les coups majeurs, défense, attaque et positions avancées."
      si: "අරුන් දේශ්පාන්ඩේ මහතාගේ සම්පූර්ණ පුහුණු පොත — grip, break, සියලු ප්‍රධාන stroke, ආරක්ෂණය, ප්‍රහාරය සහ උසස් board positions."
      hi: "अरुण देशपांडे की संपूर्ण कोचिंग पुस्तक — ग्रिप, ब्रेक, सभी प्रमुख स्ट्रोक, रक्षा, आक्रमण और उन्नत बोर्ड स्थितियाँ।"
      gu: "અરુણ દેશપાંડેની સંપૂર્ણ કોચિંગ બુક — ગ્રિપ્સ, બ્રેક્સ, દરેક મુખ્ય સ્ટ્રોક, ડિફેન્સ, ઓફેન્સ અને એડવાન્સ્ડ બોર્ડ પોઝિશન્સ."
      pl: "Kompletna książka coachingowa Aruna Deshpande — chwyty, przebicia, wszystkie główne uderzenia, obrona, atak i zaawansowane pozycje na planszy."
      mni: "ꯑꯔꯨꯟ ꯗꯦꯁꯄꯥꯟꯗꯦꯒꯤ ꯑꯣꯏꯕ ꯀꯣꯆꯤꯡ ꯄꯨꯛ — ꯒ꯭ꯔꯤꯄ, ꯕ꯭ꯔꯦꯛ, ꯃꯇꯝ ꯑꯃꯁꯨꯡ ꯑꯗꯨꯒꯨꯝꯕꯒꯤ ꯄꯣꯖꯤꯁꯟ."
      ta: "அருண் தேஷ்பாண்டேயின் முழுமையான பயிற்சி புத்தகம் — கைப்பிடிகள், இடைவேளைகள், எல்லா முக்கிய அடிகள், தற்காப்பு மற்றும் மேம்பட்ட நிலைகள்."
      te: "అరుణ్ దేశ్‌పాండే యొక్క పూర్తి కోచింగ్ పుస్తకం — గ్రిప్‌లు, బ్రేక్‌లు, అన్ని ప్రధాన స్ట్రోక్‌లు, రక్షణ, దాడి మరియు అధునాతన బోర్డు స్థానాలు."
      or: "ଅରୁଣ ଦେଶପାଣ୍ଡেଙ୍କ ସମ୍ପୂର୍ଣ କୋଚିଂ ପୁସ୍ତକ — ଗ୍ରିପ, ବ୍ରେକ, ସବୁ ମୁଖ୍ୟ ଷ୍ଟ୍ରୋକ, ଡିଫେନ୍ସ ଏବଂ ଉନ୍ନତ ବୋର୍ଡ ଅବସ୍ଥା।"
      bn: "অরুণ দেশপান্ডের সম্পূর্ণ কোচিং বই — গ্রিপ, ব্রেক, সব প্রধান স্ট্রোক, প্রতিরক্ষা, আক্রমণ এবং উন্নত বোর্ড পজিশন।"
      as: "অৰুণ দেশপাণ্ডেৰ সম্পূৰ্ণ প্ৰশিক্ষণ কিতাপ — গ্ৰিপ, ব্ৰেক, সকলো মুখ্য ষ্ট্ৰোক, প্ৰতিৰক্ষা, আক্ৰমণ আৰু উন্নত বৰ্ড অৱস্থান।"
      cs: "Kompletní trenérská kniha Aruna Deshpandeho — držení, rozehrávky, každý hlavní úder, obrana, útok a pokročilé pozice na desce."
      sr: "Комплетна тренерска књига Аруна Дешпандеа — хватови, брекови, сви главни ударци, одбрана, напад и напредне позиције на табли."
      sv: "Arun Deshpandes kompletta träningsbok — grepp, öppningsslag, alla huvudslag, försvar, anfall och avancerade positioner."
      bg: "Пълната треньорска книга на Арун Дешпанде — хватове, брейкове, всички основни удари, защита, атака и напреднали позиции на дъската."
      ur: "ارون دیش پانڈے کی مکمل کوچنگ کتاب — گرفت، بریک، تمام بڑے اسٹروکس، دفاع، حملہ، اور اعلیٰ درجے کی بورڈ پوزیشنز۔"
