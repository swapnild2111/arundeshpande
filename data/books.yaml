      fr: "Un guide concis du joueur pour le Carrom — règles, fondamentaux techniques et conseils pratiques."
      si: "කැරම් සඳහා සංක්ෂිප්ත ක්‍රීඩකයෙකුගේ මාර්ගෝපදේශය — රීති, තාක්ෂණික මූලධර්ම සහ ප්‍රායෝගික ඉඟි."
      hi: "कैरम के लिए एक संक्षिप्त खिलाड़ी मार्गदर्शिका — नियम, तकनीक के बुनियादी सिद्धांत और व्यावहारिक युक्तियाँ।"
      gu: "કેરમ માટે ખેલાડીની સંક્ષિપ્ત માર્ગદર્શિકા — નિયમો, તકનીકી મૂળભૂત બાબતો અને વ્યવહારુ ટીપ્સ."
      pl: "Zwięzły przewodnik gracza po Carrom — zasady, podstawy techniki i praktyczne wskazówki."
      mni: "ꯀꯦꯔꯝꯒꯤ ꯃꯇꯥꯡꯗ ꯊꯣꯏꯗꯣꯛꯄ ꯄ꯭ꯂꯦꯌꯔꯒꯤ ꯒꯥꯏꯗ ꯑꯃ — ꯆꯥꯡꯁꯤꯟ, ꯇꯦꯛꯅꯤꯛꯀꯤ ꯃꯔꯨꯑꯣꯏꯕ, ꯑꯃꯁꯨꯡ ꯄ꯭ꯔꯦꯛꯇꯤꯀꯦꯜ ꯇꯤꯄꯁꯤꯡ."
      ta: "கேரம் ஒரு சுருக்கமான வீரர் வழிகாட்டி — விதிகள், நுட்ப அடிப்படைகள் மற்றும் நடைமுறை குறிப்புகள்."
      te: "క్యారమ్‌కు సంక్షిప్త ఆటగాడి గైడ్ — నియమాలు, సాంకేతికత ప్రాథమిక అంశాలు మరియు ఆచరణాత్మక చిట్కాలు."
      or: "କ୍ୟାରମ ପାଇଁ ଏକ ସଂକ୍ଷିପ୍ତ ଖେଳାଳିଙ୍କ ଗାଇଡ — ନିୟମ, କୌଶଳ ମୌଳିକତା, ଏବଂ ବ୍ୟବହାରିକ ଟିପ୍ସ।"
